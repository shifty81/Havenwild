[package]
name = "haven_bevy_candidate"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false

# An isolated Rust workspace: not adopted by Havenwild's main Cargo graph.
[workspace]
resolver = "2"

[dependencies]
bevy = "=0.19.0"
bevy_egui = "=0.42.0"
forge_gui_chrome = { git = "https://github.com/shifty81/ForgeGUI_Core", rev = "eafa8e78efd54142a19e66d8be7b7d3985af23d2" }
forge_gui_shell = { git = "https://github.com/shifty81/ForgeGUI_Core", rev = "eafa8e78efd54142a19e66d8be7b7d3985af23d2" }
forge_gui_theme = { git = "https://github.com/shifty81/ForgeGUI_Core", rev = "eafa8e78efd54142a19e66d8be7b7d3985af23d2" }
serde_json = "1"
sha2 = "0.10"
